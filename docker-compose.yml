version: "3.9"

services:
  test_solver:
    build: .
    image: shilovars/test_solver:1.0.0
    container_name: test_solver_app
    depends_on:
      - db
      - flyway
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/test_solver_db
      PYTHONPATH: /app
      API_KEY: ${API_KEY}
      TOKEN_BOT: ${TOKEN_BOT}
      HOST: ${HOST}
      USER: ${USER}
      PASSWORD_DB: ${PASSWORD_DB}
      DBNAME: ${DBNAME}
      PORT: ${PORT}
    restart: unless-stopped

  db:
    image: postgres:17.4-alpine
    container_name: test_solver_db
    environment:
      POSTGRES_USER: djan-capcan
      POSTGRES_PASSWORD: cL49I1v0EQgbX0s7Ad
      POSTGRES_DB: test_solver_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U djan-capcan -d test_solver_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:11.17.0
    container_name: test_solver_migrations
    command: -url=jdbc:postgresql://db:5432/test_solver_db -user=djan-capcan -password=cL49I1v0EQgbX0s7Ad -schemas=public -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


volumes:
  postgres_data:
